            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
  /api/v1/admin/registro/exportar:
    get:
      tags:
      - Administración
      summary: Respaldo del registro de emisiones (JSON Lines).
      parameters:
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
