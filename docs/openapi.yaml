components:
  schemas:
    AlicuotaIva:
      type: object
      properties:
        id:
          type: integer
          description: 'Código de alícuota (FEParamGetTiposIva): 3=0%, 4=10.5%, 5=21%,
            6=27%, 8=5%, 9=2.5%.'
          format: int32
        baseImp:
          type: number
          format: double
        importe:
          type: number
          format: double
      additionalProperties: false
    ArcaMensaje:
      type: object
      properties:
        code:
          type: integer
          format: int32
        msg:
          type: string
          nullable: true
      additionalProperties: false
      description: Error/evento/observación devuelto por ARCA.
    CabeceraRespuesta:
      type: object
      properties:
        cuit:
          type: integer
          format: int64
        ptoVta:
          type: integer
          format: int32
        cbteTipo:
          type: integer
          format: int32
        fchProceso:
          type: string
          nullable: true
        cantReg:
          type: integer
          format: int32
        resultado:
          type: string
          description: A=Aprobado, R=Rechazado, P=Parcial.
          nullable: true
        reproceso:
          type: string
          nullable: true
      additionalProperties: false
    Caea:
      type: object
      properties:
        codigo:
          type: string
          nullable: true
        periodo:
          type: integer
          format: int32
        orden:
          type: integer
          format: int32
        fchVigDesde:
          type: string
          nullable: true
        fchVigHasta:
          type: string
          nullable: true
        fchTopeInf:
          type: string
          nullable: true
        fchProceso:
          type: string
          nullable: true
        observaciones:
          type: array
          items:
            $ref: '#/components/schemas/ArcaMensaje'
          nullable: true
      additionalProperties: false
    CaeaSinMovimiento:
      type: object
      properties:
        caea:
          type: string
          nullable: true
        fchProceso:
          type: string
          nullable: true
        ptoVta:
          type: integer
          format: int32
        resultado:
          type: string
          nullable: true
      additionalProperties: false
    CierreDiario:
      type: object
      properties:
        fecha:
          type: string
          nullable: true
        tipos:
          type: array
          items:
            $ref: '#/components/schemas/CierreTipo'
          nullable: true
        pendientes:
          type: integer
          format: int32
        consistente:
          type: boolean
          readOnly: true
      additionalProperties: false
    CierreTipo:
      type: object
      properties:
        ptoVta:
          type: integer
          format: int32
        cbteTipo:
          type: integer
          format: int32
        descripcion:
          type: string
          nullable: true
        emitidos:
          type: integer
          format: int32
        total:
          type: number
          format: double
        ultimoRegistro:
          type: integer
          format: int64
        ultimoArca:
          type: integer
          format: int64
        consistente:
          type: boolean
          description: true si el último número de ARCA coincide con el último emitido
            por este servicio.
          readOnly: true
      additionalProperties: false
    Comprador:
      type: object
      properties:
        docTipo:
          type: integer
          format: int32
        docNro:
          type: integer
          format: int64
        porcentaje:
          type: number
          format: double
      additionalProperties: false
    ComprobanteAsociado:
      type: object
      properties:
        tipo:
          type: integer
          description: Tipo de comprobante asociado (FEParamGetTiposCbte).
          format: int32
        ptoVta:
          type: integer
          format: int32
        nro:
          type: integer
          format: int64
        cuit:
          type: string
          description: CUIT del emisor del comprobante asociado (opcional).
          nullable: true
        cbteFch:
          type: string
          description: Fecha del comprobante asociado, yyyyMMdd (opcional).
          nullable: true
      additionalProperties: false
      description: Comprobante asociado (obligatorio en Notas de Crédito/Débito si
        no se informa PeriodoAsoc).
    ComprobanteCaea:
      type: object
      properties:
        concepto:
          maximum: 3
          minimum: 1
          type: integer
          description: 1=Productos, 2=Servicios, 3=Productos y Servicios.
          format: int32
        docTipo:
          type: integer
          description: Tipo de documento del receptor (80=CUIT, 86=CUIL, 96=DNI, 99=Consumidor
            Final sin identificar).
          format: int32
        docNro:
          type: integer
          format: int64
        cbteFch:
          type: string
          description: Fecha del comprobante yyyyMMdd. Si se omite, ARCA usa la fecha
            de proceso.
          nullable: true
        impTotal:
          type: number
          format: double
        impTotConc:
          type: number
          format: double
        impNeto:
          type: number
          format: double
        impOpEx:
          type: number
          format: double
        impTrib:
          type: number
          format: double
        impIVA:
          type: number
          format: double
        fchServDesde:
          type: string
          description: yyyyMMdd. Obligatorio si Concepto es 2 o 3.
          nullable: true
        fchServHasta:
          type: string
          description: yyyyMMdd. Obligatorio si Concepto es 2 o 3.
          nullable: true
        fchVtoPago:
          type: string
          description: yyyyMMdd. Obligatorio si Concepto es 2 o 3 (salvo Factura de
            Crédito Electrónica).
          nullable: true
        monId:
          type: string
          description: Código de moneda (FEParamGetTiposMonedas). PES = pesos.
          nullable: true
        monCotiz:
          type: number
          format: double
        canMisMonExt:
          type: string
          description: '"S" si se cancela en la misma moneda extranjera, "N" si no
            (sólo MonId distinto de PES).'
          nullable: true
        condicionIVAReceptorId:
