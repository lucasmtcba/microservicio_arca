  /api/v1/admin/puntos-venta:
    get:
      tags:
      - Administración
      summary: Puntos de venta con estado legible (habilitado / bloqueado / dado de
        baja).
      parameters:
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items: {}
  /api/v1/admin/rechazos:
    get:
      tags:
      - Administración
      summary: Rechazos recientes de ARCA y códigos más frecuentes.
      parameters:
      - name: maximo
        in: query
        schema:
          maximum: 500
          minimum: 1
          type: integer
          format: int32
          default: 50
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
