          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
  /api/v1/caea/{periodo}/{orden}:
    post:
      tags:
      - CAEA
      summary: FECAEASolicitar. Periodo yyyyMM, orden 1 (días 1-15) o 2 (16-fin de
        mes).
      parameters:
      - name: periodo
        in: path
        required: true
        schema:
          maximum: 299912
          minimum: 200001
          type: integer
          format: int32
      - name: orden
        in: path
        required: true
        schema:
          maximum: 2
          minimum: 1
          type: integer
          format: int32
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
