openapi: 3.0.1
info:
  title: Microservicio de Facturación Electrónica ARCA (ex AFIP)
  description: Fachada REST sobre WSAA + WSFEv1 de ARCA. Obtiene CAE/CAEA, consulta
    comprobantes y tablas de parámetros, emite notas de crédito, calcula importes
    y genera el QR fiscal. Autenticación por cabecera X-Api-Key (permisos emitir /
    consultar / admin). Fechas yyyyMMdd, importes con punto decimal y hasta 2 decimales.
    Todas las respuestas incluyen X-Correlation-Id.
  version: v1
paths:
  /api/v1/admin/emisiones:
    get:
      tags:
      - Administración
      summary: Búsqueda paginada de emisiones por punto de venta, tipo, fechas, documento,
        estado o cliente.
      parameters:
      - name: PtoVta
        in: query
        schema:
          type: integer
          format: int32
      - name: CbteTipo
        in: query
        schema:
          type: integer
          format: int32
      - name: Desde
        in: query
        description: yyyyMMdd
        schema:
          type: string
      - name: Hasta
        in: query
        description: yyyyMMdd
        schema:
          type: string
      - name: DocNro
        in: query
        schema:
          type: integer
          format: int64
      - name: Estado
        in: query
        schema:
          $ref: '#/components/schemas/EstadoEmision'
      - name: Cliente
        in: query
        schema:
          type: string
      - name: Referencia
        in: query
        description: Referencia externa exacta.
        schema:
          type: string
      - name: Pagina
        in: query
        schema:
          type: integer
          format: int32
      - name: TamanoPagina
        in: query
        schema:
          type: integer
          format: int32
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroEmisionPagina'
  /api/v1/admin/resumen-iva:
    get:
      tags:
      - Administración
      summary: Resumen de IVA por alícuota del período (en pesos; las notas de crédito
        restan).
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          pattern: ^\d{8}$
          type: string
      - name: hasta
        in: query
        required: true
        schema:
          pattern: ^\d{8}$
          type: string
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenIva'
  /api/v1/admin/exportar.csv:
    get:
      tags:
      - Administración
      summary: Exporta a CSV (Excel) los comprobantes autorizados del período.
      parameters:
      - name: desde
        in: query
        schema:
          pattern: ^\d{8}$
          type: string
      - name: hasta
        in: query
        schema:
          pattern: ^\d{8}$
          type: string
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
  /api/v1/admin/auditoria-numeracion/{ptoVta}/{cbteTipo}:
    get:
      tags:
      - Administración
      summary: Números autorizados en ARCA que no emitió este servicio (otro sistema
        usa el punto de venta).
      parameters:
      - name: ptoVta
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: cbteTipo
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: desde
        in: query
        schema:
          minimum: 1
          type: integer
          format: int64
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
  /api/v1/admin/auditoria:
    get:
      tags:
      - Administración
      summary: Consulta la auditoría (más recientes primero).
      parameters:
      - name: desde
        in: query
        schema:
          type: string
          format: date-time
      - name: cliente
        in: query
        schema:
          type: string
      - name: maximo
        in: query
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
          default: 100
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
          dígitos, - y _).'
        schema:
          type: string
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              description: Identificador de correlación (eco del enviado o generado).
              schema:
                type: string
            X-Api-Version:
              description: Versión del servicio.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaAuditoria'
  /api/v1/admin/config:
    get:
      tags:
      - Administración
      summary: Configuración efectiva (sin secretos) y advertencias de riesgo.
      parameters:
      - name: X-Correlation-Id
        in: header
        description: 'Opcional: identificador de correlación propio (máx. 64, letras,
